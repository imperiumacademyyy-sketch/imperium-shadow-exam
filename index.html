<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperium Shadow Exam</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Imperium Academy</h1>
    <p>Forged for Excellence.</p>
    <button onclick="startExam()">Start Shadow Exam</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function startExam() {
            const userName = tg.initDataUnsafe.user?.first_name || "Student";
            alert("Welcome, " + userName);
        }
    </script>
</body>
</html>
