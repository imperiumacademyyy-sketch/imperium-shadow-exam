<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    ><title>Imperium Academy | Shadow Exam</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        color: #111;
    }

    #exam-container {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
        margin-top: 0;
    }

    #status {
        color: #666;
        margin-bottom: 20px;
        font-size: 14px;
    }

    #progress {
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    #subject {
        color: #666;
        font-size: 14px;
        margin-bottom: 10px;
    }

    #question-text {
        font-size: 19px;
        line-height: 1.5;
        font-weight: 600;
        margin-bottom: 20px;
    }

    .option-btn {
        display: block;
        width: 100%;
        margin: 10px 0;
        padding: 14px;
        cursor: pointer;
        border: 1px solid #ccc;
        border-radius: 8px;
        background: #fff;
        text-align: left;
        font-size: 16px;
        transition: 0.2s;
    }

    .option-btn:hover {
        background: #f0f0f0;
    }

    .option-btn.selected {
        background: #e8f0fe;
        border-color: #4285f4;
    }

    #next-btn {
        display: none;
        width: 100%;
        margin-top: 20px;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #111;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
    }

    #next-btn:hover {
        background: #333;
    }

    #error-box {
        display: none;
        margin-top: 15px;
        padding: 12px;
        border-radius: 8px;
        background: #ffecec;
        color: #b00020;
        font-size: 14px;
        white-space: pre-wrap;
    }

    #loading {
        text-align: center;
        padding: 30px 10px;
    }

    #exam-content {
        display: none;
    }
</style>

</head><body><div id="exam-container"><h1>Shadow Exam</h1>

<div id="loading">
    <p id="status">
        Generating your examination...
    </p>
</div>

<div id="error-box"></div>

<div id="exam-content">

    <div id="progress"></div>

    <div id="subject"></div>

    <div id="question-text"></div>

    <div id="options-area"></div>

    <button id="next-btn">
        Next Question
    </button>

</div>

</div><script>

    // =========================================================
    // SUPABASE CONFIGURATION
    // =========================================================

    const SUPABASE_URL =
        'https://zguxchkcfssauysikavw.supabase.co';

    const SUPABASE_ANON_KEY =
        'sb_publishable_uJkG_1H-LysZ2NXyUu5VYQ_vJQOEujC';

    const FUNCTION_URL =
        'https://zguxchkcfssauysikavw.supabase.co/functions/v1/hyper-function';


    // =========================================================
    // EXAM STATE
    // =========================================================

    let questions = [];

    let currentQuestionIndex = 0;

    let selectedAnswer = null;


    // =========================================================
    // DOM ELEMENTS
    // =========================================================

    const loading =
        document.getElementById('loading');

    const status =
        document.getElementById('status');

    const errorBox =
        document.getElementById('error-box');

    const examContent =
        document.getElementById('exam-content');

    const progress =
        document.getElementById('progress');

    const subject =
        document.getElementById('subject');

    const questionText =
        document.getElementById('question-text');

    const optionsArea =
        document.getElementById('options-area');

    const nextButton =
        document.getElementById('next-btn');


    // =========================================================
    // GENERATE EXAM
    // =========================================================

    async function fetchExam() {

        try {

            status.innerText =
                'Generating your 80-question examination...';


            console.log(
                'Calling Edge Function:',
                FUNCTION_URL
            );


            const response = await fetch(
                FUNCTION_URL,
                {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json',

                        'apikey':
                            SUPABASE_ANON_KEY,

                        'Authorization':
                            'Bearer ' +
                            SUPABASE_ANON_KEY
                    },

                    body: JSON.stringify({

                        subjects: [
                            'Use of English',
                            'Mathematics',
                            'Physics',
                            'Chemistry'
                        ],

                        questionsPerSubject: 20,

                        difficulty: 'Hard'

                    })
                }
            );


            // -------------------------------------------------
            // READ RESPONSE
            // -------------------------------------------------

            const data =
                await response.json();


            console.log(
                'Edge Function response:',
                data
            );


            // -------------------------------------------------
            // HTTP ERROR
            // -------------------------------------------------

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    `Server returned HTTP ${response.status}`
                );
            }


            // -------------------------------------------------
            // APPLICATION ERROR
            // -------------------------------------------------

            if (!data.success) {

                throw new Error(
                    data.error ||
                    'Exam generation failed.'
                );
            }


            // -------------------------------------------------
            // VERIFY EXAM
            // -------------------------------------------------

            if (
                !data.exam ||
                !Array.isArray(data.exam.subjects)
            ) {

                throw new Error(
                    'The server returned an invalid exam structure.'
                );
            }


            // -------------------------------------------------
            // FLATTEN SUBJECT QUESTIONS
            // -------------------------------------------------

            questions = [];


            for (
                const subjectExam
                of data.exam.subjects
            ) {

                if (
                    !Array.isArray(
                        subjectExam.questions
                    )
                ) {
                    continue;
                }


                for (
                    const question
                    of subjectExam.questions
                ) {

                    questions.push({

                        id:
                            question.id,

                        subject:
                            subjectExam.subject,

                        question:
                            question.question,

                        options:
                            question.options,

                        topic:
                            question.topic

                    });

                }

            }


            // -------------------------------------------------
            // VERIFY QUESTION COUNT
            // -------------------------------------------------

            if (questions.length !== 80) {

                throw new Error(
                    `Expected 80 questions but received ${questions.length}.`
                );
            }


            console.log(
                `Successfully received ${questions.length} questions.`
            );


            // -------------------------------------------------
            // SHOW EXAM
            // -------------------------------------------------

            loading.style.display =
                'none';

            errorBox.style.display =
                'none';

            examContent.style.display =
                'block';


            currentQuestionIndex = 0;

            showQuestion();


        } catch (error) {

            console.error(
                'Exam generation failed:',
                error
            );


            loading.style.display =
                'none';

            examContent.style.display =
                'none';

            errorBox.style.display =
                'block';


            errorBox.innerText =
                'Unable to generate the examination.\n\n' +
                (
                    error instanceof Error
                        ? error.message
                        : String(error)
                );
        }
    }


    // =========================================================
    // DISPLAY QUESTION
    // =========================================================

    function showQuestion() {

        if (
            currentQuestionIndex >=
            questions.length
        ) {

            finishExam();

            return;
        }


        const currentQuestion =
            questions[
                currentQuestionIndex
            ];


        selectedAnswer = null;


        progress.innerText =
            `Question ${
                currentQuestionIndex + 1
            } of ${
                questions.length
            }`;


        subject.innerText =
            currentQuestion.subject;


        questionText.innerText =
            currentQuestion.question;


        optionsArea.innerHTML =
            '';


        nextButton.style.display =
            'none';


        // -----------------------------------------------------
        // CREATE OPTIONS
        // -----------------------------------------------------

        for (
            const option
            of currentQuestion.options
        ) {

            const button =
                document.createElement(
                    'button'
                );


            button.className =
                'option-btn';


            button.innerText =
                `${option.label}. ${option.text}`;


            button.onclick = () => {

                selectAnswer(
                    option.label,
                    button
                );

            };


            optionsArea.appendChild(
                button
            );
        }
    }


    // =========================================================
    // SELECT ANSWER
    // =========================================================

    function selectAnswer(
        answer,
        selectedButton
    ) {

        selectedAnswer =
            answer;


        const buttons =
            optionsArea.querySelectorAll(
                '.option-btn'
            );


        buttons.forEach(
            button => {

                button.classList.remove(
                    'selected'
                );

            }
        );


        selectedButton.classList.add(
            'selected'
        );


        nextButton.style.display =
            'block';
    }


    // =========================================================
    // NEXT QUESTION
    // =========================================================

    nextButton.onclick = () => {

        if (!selectedAnswer) {

            return;
        }


        currentQuestionIndex++;


        showQuestion();
    };


    // =========================================================
    // FINISH EXAM
    // =========================================================

    function finishExam() {

        examContent.innerHTML = `

            <div style="text-align:center;">

                <h2>Exam Complete</h2>

                <p>
                    You have completed all
                    ${questions.length}
                    questions.
                </p>

            </div>

        `;
    }


    // =========================================================
    // START
    // =========================================================

    fetchExam();

</script></body>
</html>
